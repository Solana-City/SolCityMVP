# ─────────────────────────────────────────────────────────────────────────────
# Solana dApp Store — Publishing Config
# The Solana City (Sol City)
#
# How to use:
#   1. Complete the REPLACE_WITH_* fields below
#   2. Run: npx dapp-store init          (fills in address fields)
#   3. Run: npx dapp-store create publisher
#   4. Run: npx dapp-store create app
#   5. Run: npx dapp-store create release
#   6. Run: npx dapp-store publish submit --requestor-is-authorized --complies-with-solana-dapp-store-policies
#
# Full guide: SEEKER_LAUNCH.md in repo root
# Docs: https://docs.solanamobile.com/dapp-publishing/overview
# ─────────────────────────────────────────────────────────────────────────────

publisher:
  address: ""   # filled in by: npx dapp-store create publisher
  name: "The Solana City"
  website: "https://www.solanacity.io"
  email: "REPLACE_WITH_CONTACT_EMAIL"
  support_email: "REPLACE_WITH_SUPPORT_EMAIL"

app:
  address: ""   # filled in by: npx dapp-store create app
  name: "The Solana City"
  android_package: "io.solanacity.app"
  urls:
    license_url: "https://www.solanacity.io/terms"
    copyright_url: "https://www.solanacity.io/terms"
    privacy_policy_url: "https://www.solanacity.io/privacy"
    website_url: "https://www.solanacity.io"
  media:
    - purpose: icon
      uri: "app-icon-512.png"   # 512×512 PNG — place in dapp-store/assets/

release:
  address: ""   # filled in by: npx dapp-store create release
  version: "1.0.0"
  media:
    - purpose: icon
      uri: "app-icon-512.png"
    - purpose: banner
      uri: "banner-1200x600.png"    # REPLACE — 1200×600 PNG
    - purpose: screenshot
      uri: "screenshot-01.png"      # REPLACE — 1080×1920 PNG (portrait) or 1920×1080 (landscape)
    - purpose: screenshot
      uri: "screenshot-02.png"
    - purpose: screenshot
      uri: "screenshot-03.png"
    - purpose: screenshot
      uri: "screenshot-04.png"
  files:
    - purpose: install
      uri: "SolCity-v1.0.0.apk"    # generated by: bubblewrap build
  catalog:
    en:
      name: "The Solana City"
      short_description: "A multiplayer 2D city where every interaction is a real Solana transaction."
      long_description: |
        Explore The Solana City — a living, multiplayer 2D world built entirely on Solana.

        Every NPC interaction is a real on-chain transaction. Swap tokens with Jupiter Joe,
        send SOL to other players, play the Sushi Station minigame, and discover the secrets
        of the city. Your wallet is your identity.

        Built for Seeker. Powered by Solana.

        Features:
        • Real-time multiplayer via MagicBlock ephemeral rollups
        • Token swaps via Jupiter Aggregator
        • SOL transfers directly in-game
        • Mobile Wallet Adapter — connects to Seed Vault natively
        • Pixel-art world with touch controls and joystick
        • No ads. No accounts. Just your wallet.
      new_in_version: "Initial launch on the Seeker dApp Store."
      saga_features: ""

android:
  android_package: "io.solanacity.app"
  locales:
    - en
  solana_mobile_dapp_publisher_portal:
    google_store_package: ""   # leave blank (not on Google Play)
    testing_instructions: |
      1. Open the app — it loads immediately as a web app (TWA).
      2. Tap "Connect Wallet" in the top right to connect your Seed Vault.
      3. Walk around the map using the on-screen joystick (bottom-left).
      4. Approach any NPC and tap the interact button to open their panel.
      5. Try the Sushi Station minigame: walk to the food cart (center-right of the map)
         and interact with the Sushi Man.
      The app runs on devnet. Use a devnet wallet with airdropped SOL for testing.
  alpha_testers: []
