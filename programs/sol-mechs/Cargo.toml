[package]
name = "sol-mechs"
version = "0.1.0"
description = "Sol Mechs casual PvP: lobby pairing and commit-reveal action exchange on a MagicBlock Ephemeral Rollup"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sol_mechs"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
default = []

[dependencies]
anchor-lang = "0.30.1"
# Direct, although anchor-lang already pulls it in, because the `pubkey!` macro
# expands to an absolute `::solana_program::...` path that only resolves when
# the crate is a dependency of THIS one. Playground happens to provide it, which
# is why the omission never showed up there and only surfaced the first time
# these programs were built anywhere else. Pinned to the version anchor-lang
# 0.30.1 already resolves, so nothing else in the lock moves.
solana-program = "1.18.26"
# Direct for the same reason as solana-program above: anchor's `zero_copy`
# attribute expands to absolute `::bytemuck::` paths, which resolve only when
# the crate belongs to this one. MatchQueue and the other zero-copy accounts
# are what need it. The derive feature carries the Pod and Zeroable macros the
# expansion asks for.
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
