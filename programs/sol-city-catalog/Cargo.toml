[package]
name = "sol-city-catalog"
version = "0.1.0"
description = "Shared vocabulary for the Sol City programs: catalog blocks and the UnlockState account"
edition = "2021"

# A LIBRARY, and only a library. No cdylib, so there is nothing here that
# could ever be mistaken for a program or carry an entrypoint to leak. That is
# the whole point of the crate: see the note at the top of src/lib.rs.
[lib]
crate-type = ["lib"]
name = "sol_city_catalog"

[dependencies]
# Pinned to what both programs use. This crate defines an account LAYOUT that
# both serialise and deserialise, so a different Anchor here than there is a
# way to make the two disagree about bytes on chain.
anchor-lang = "0.30.1"
