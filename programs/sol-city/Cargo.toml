[package]
name = "sol-city"
version = "0.1.0"
description = "The Solana City on-chain player state program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sol_city"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
default = []

[dependencies]
# Plain anchor-lang, with no conditional-init feature enabled: every account
# this program creates is created by an explicit `init` in an instruction
# dedicated to it, so re-initialisation is not reachable even by accident.
anchor-lang = "0.30.1"
# Direct, although anchor-lang already pulls it in, because the `pubkey!` macro
# expands to an absolute `::solana_program::...` path that only resolves when
# the crate is a dependency of THIS one. Playground happens to provide it, which
# is why the omission never showed up there and only surfaced the first time
# these programs were built anywhere else. Pinned to the version anchor-lang
# 0.30.1 already resolves, so nothing else in the lock moves.
solana-program = "1.18.26"
# The shared vocabulary, NOT the collectibles program.
#
# The city used to take sol-city-collectibles with `no-entrypoint` to get this
# layout. Correct on its own, wrong in combination: cargo unifies features
# across one invocation, so a workspace build handed the collectibles cdylib
# that same feature and emitted a 4 KB object with no entrypoint, exit 0.
#
# A crate that is not a program has no entrypoint to leak. No program depends
# on another program now, so that cannot happen rather than being checked for.
sol-city-catalog = { path = "../sol-city-catalog" }
