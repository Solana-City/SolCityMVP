[package]
name = "sol-city"
version = "0.1.0"
description = "The Solana City on-chain player state program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sol_city"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
default = []

[dependencies]
# Plain anchor-lang, with no conditional-init feature enabled: every account
# this program creates is created by an explicit `init` in an instruction
# dedicated to it, so re-initialisation is not reachable even by accident.
anchor-lang = "0.30.1"
# Direct, although anchor-lang already pulls it in, because the `pubkey!` macro
# expands to an absolute `::solana_program::...` path that only resolves when
# the crate is a dependency of THIS one. Playground happens to provide it, which
# is why the omission never showed up there and only surfaced the first time
# these programs were built anywhere else. Pinned to the version anchor-lang
# 0.30.1 already resolves, so nothing else in the lock moves.
solana-program = "1.18.26"
# The collectibles program, as a LIBRARY only.
#
# `no-entrypoint` so its entrypoint is not compiled into this binary: what is
# wanted is the UnlockState layout and the catalog boundaries, not its
# instructions. The dependency goes this way and only this way, because
# nothing in collectibles touches PlayerState, so there is no cycle.
#
# This is also what makes `Account<'info, UnlockState>` in SyncUnlocks check
# the right owner: the Owner impl comes from that crate's declare_id!, so
# Anchor refuses an UnlockState that is not owned by the collectibles
# program, which is a check nobody has to remember to write.
sol-city-collectibles = { path = "../sol-city-collectibles", features = ["no-entrypoint"] }
