[package]
name = "sol-city"
version = "0.1.0"
description = "The Solana City on-chain player state program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sol_city"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
default = []

[dependencies]
# Plain anchor-lang, with no conditional-init feature enabled: every account
# this program creates is created by an explicit `init` in an instruction
# dedicated to it, so re-initialisation is not reachable even by accident.
anchor-lang = "0.30.1"
# Direct, although anchor-lang already pulls it in, because the `pubkey!` macro
# expands to an absolute `::solana_program::...` path that only resolves when
# the crate is a dependency of THIS one. Playground happens to provide it, which
# is why the omission never showed up there and only surfaced the first time
# these programs were built anywhere else. Pinned to the version anchor-lang
# 0.30.1 already resolves, so nothing else in the lock moves.
solana-program = "1.18.26"
# MagicBlock VRF is called by hand-rolled CPI (see lib.rs): Solana Playground
# cannot build ephemeral-vrf-sdk, so there is no SDK dependency.
#
# Bubblegum, for minting a pack item as a compressed NFT.
#
# Pinned to 2.1.1 and it cannot simply be raised: 3.x and 4.x require
# `solana-program ^3.0.0` and `anchor-lang ^1.0.0`, and this program is on
# 1.18.26 / 0.30.1. Taking them would mean migrating Anchor first, which is a
# different and much larger job than minting a hat.
#
# What this crate gives us is instruction BUILDERS; the Bubblegum program on
# chain is whatever is deployed there, and the v1 instruction layout has not
# moved. If this does not resolve against our toolchain, the fallback is a
# hand-rolled CPI, which is how the delegation and VRF calls already work.
mpl-bubblegum = { version = "2.1.1", default-features = false }
