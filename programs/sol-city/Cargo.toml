[package]
name = "sol-city"
version = "0.1.0"
description = "The Solana City on-chain player state program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sol_city"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.31"
ephemeral-rollups-sdk = { version = "0.12", features = ["anchor"] }
