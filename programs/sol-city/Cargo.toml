[package]
name = "sol-city"
version = "0.1.0"
description = "The Solana City on-chain player state program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sol_city"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
default = []

[dependencies]
# Plain anchor-lang, with no conditional-init feature enabled: every account
# this program creates is created by an explicit `init` in an instruction
# dedicated to it, so re-initialisation is not reachable even by accident.
anchor-lang = "0.30.2"
# MagicBlock VRF is called by hand-rolled CPI (see lib.rs): Solana Playground
# cannot build ephemeral-vrf-sdk, so there is no SDK dependency.
