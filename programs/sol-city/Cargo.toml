[package]
name = "sol-city"
version = "0.1.0"
description = "The Solana City on-chain player state program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sol_city"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
# MagicBlock ephemeral VRF — verifiable randomness for the outfit booster.
# The `anchor` feature provides the #[vrf] macro + invoke_signed_vrf helper.
ephemeral-vrf-sdk = { version = "0.3.0", features = ["anchor"] }
