name: programs

# The Solana programs have had no compiler behind them. The only machine that
# works on them is a Windows box with no SBF toolchain and, until the Windows
# SDK is installed, no host linker either, so even `cargo check` fails on a
# proc-macro build script. Solana Playground has been the first compile, which
# means every mistake waits until deploy day to show itself.
#
# A Linux runner has none of those problems. This gives the programs a real
# type check on every push, a real artifact, and an answer to whether they
# build for sBPFv3, without anything being installed locally.

on:
  push:
    paths: ["programs/**", "Cargo.toml", "Cargo.lock", ".github/workflows/programs.yml"]
  pull_request:
    paths: ["programs/**", "Cargo.toml", "Cargo.lock", ".github/workflows/programs.yml"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The fast one, and the one that matters most day to day: does the Rust
  # compile at all. No Solana toolchain, so it finishes in a couple of minutes.
  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Not sol-mechs. Its zero-copy accounts derive Pod on the BPF target and
      # not on the host, where alignment differs, so a host check reports
      # errors that the real build does not have. It is covered by build-sbf
      # below, which compiles for the target that ships.
      #
      # sol-mechs-engine IS here, and that is the whole reason it is a crate
      # of its own: combat arithmetic has no accounts in it, so the host can
      # check and test it, and the vectors ported from the TypeScript engine
      # become a gate instead of a file nobody runs.
      - name: Check every crate
        run: cargo check --locked -p sol-city -p sol-city-collectibles -p sol-city-catalog -p sol-mechs-engine
      # The catalog crate names the collectibles program id and pins the
      # UnlockState discriminator, both of which are one fact written in two
      # places. These tests are what make that safe rather than hopeful, so
      # they are a gate and not a warning.
      - name: Tests
        run: cargo test --locked -p sol-city-catalog -p sol-city-collectibles -p sol-mechs-engine
      - name: Warnings, reported but not fatal
        run: cargo clippy --locked -p sol-city -p sol-city-collectibles -p sol-city-catalog -- -W clippy::all || true

  # The artifact. Builds the BPF object the way a deploy would, and checks what
  # came out rather than trusting the exit code: a build can succeed and still
  # be the wrong sBPF version or carry the wrong program id.
  build:
    name: build-sbf (${{ matrix.arch }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.arch == 'v3' }}
    strategy:
      fail-fast: false
      matrix:
        # v0 is what deploys today. v3 is what SIMD-0500 will require from
        # Agave 4.4 onward, and is allowed to fail: anchor-lang is pinned at
        # 0.30.1 and the supported floor for v3 is 0.31.2, so this job exists
        # partly to tell us exactly how it fails.
        arch: [v0, v3]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Agave 4.3.0
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.3.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Versions
        run: |
          solana --version
          cargo build-sbf --version

      # ONE INVOCATION PER PROGRAM, and the order matters.
      #
      # Not `cargo build-sbf` over the workspace. sol-city depends on
      # sol-city-collectibles with `no-entrypoint`, and cargo unifies features
      # across a single invocation, so a workspace build applies that feature
      # to the collectibles cdylib as well and emits a 4 KB stub with no
      # entrypoint. It exits 0. The first attempt at this shipped exactly that
      # and only the size gave it away.
      #
      # Building each manifest on its own means the collectibles build does
      # not have no-entrypoint turned on by anyone. It goes LAST because both
      # builds write the same .so path and the last one wins.
      - name: Build
        id: build
        run: |
          ARCH=""
          if [ "${{ matrix.arch }}" = "v3" ]; then ARCH="--arch v3"; fi
          cargo build-sbf $ARCH --manifest-path programs/sol-mechs/Cargo.toml
          cargo build-sbf $ARCH --manifest-path programs/sol-city/Cargo.toml
          cargo build-sbf $ARCH --manifest-path programs/sol-city-collectibles/Cargo.toml

      - name: Inspect the artifact
        if: steps.build.outcome == 'success'
        run: |
          SO=$(find target -name 'sol_city.so' | head -1)
          echo "artifact: $SO"
          ls -la "$SO"
          readelf -h "$SO" | grep -i flags
          echo "--- dynamic linking (must be empty for v3) ---"
          readelf -l "$SO" | grep DYNAMIC || echo "  none"
          readelf -S "$SO" | grep -E '\.rel\.dyn|\.dynsym|\.dynamic' || echo "  none"
          echo "=== sol_city_collectibles ==="
          SC=$(find target -name 'sol_city_collectibles.so' | head -1)
          ls -la "$SC" && readelf -h "$SC" | grep -i flags
          # A program that is not a program. See the note on the Build step:
          # with no-entrypoint leaking in, this is ~4 KB and still exits 0, so
          # size is the only thing that tells the difference.
          for F in "$SO" "$SC"; do
            SZ=$(stat -c%s "$F")
            if [ "$SZ" -lt 100000 ]; then
              echo "FAIL: $F is $SZ bytes, which is a stub and not a program"
              exit 1
            fi
          done
          echo "=== sol_mechs ==="
          SM=$(find target -name 'sol_mechs.so' | head -1)
          ls -la "$SM" && readelf -h "$SM" | grep -i flags

      - name: Check the declare_id is the one we deploy to
        if: steps.build.outcome == 'success'
        run: |
          python3 - "$(find target -name 'sol_city.so' | head -1)" <<'PY'
          import sys, io
          A = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"
          def dec(s):
              n = 0
              for c in s: n = n * 58 + A.index(c)
              return n.to_bytes(32, "big")
          want = "HPvDFVnruSXHwKKP44eUvRh8oYqBaHCeQbK1sKWT1aU2"
          blob = io.open(sys.argv[1], "rb").read()
          # Both programs, because a split is exactly when an id goes astray.
          if blob.count(dec(want)):
              print(f"declare_id OK: {want}")
          else:
              print(f"declare_id MISSING: {want} is not in this binary")
              sys.exit(1)
          PY
          python3 - "$(find target -name 'sol_city_collectibles.so' | head -1)" <<'PY'
          import sys, io
          A = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"
          def dec(s):
              n = 0
              for c in s: n = n * 58 + A.index(c)
              return n.to_bytes(32, "big")
          want = "EptRxVBysFzJEz52r58c2yCkpDGvF55aBPj1eCkWaphz"
          blob = io.open(sys.argv[1], "rb").read()
          if blob.count(dec(want)):
              print(f"declare_id OK: {want}")
          else:
              print(f"declare_id MISSING: {want} is not in this binary")
              sys.exit(1)
          PY

      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: sol_city-${{ matrix.arch }}
          path: |
            target/**/sol_city.so
            target/**/sol_city_collectibles.so
            target/**/sol_mechs.so
          if-no-files-found: error
          retention-days: 30
